<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popup screenshot</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
      }
      body {
        display: grid;
        grid-template-columns: 1fr 340px;
        align-items: center;
        gap: 96px;
        padding: 0 140px;
        box-sizing: border-box;
        background: #fafafa;
        color: #000;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 44px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 460px;
        font-size: 20px;
        line-height: 1.45;
        color: #555;
      }
      img {
        display: block;
        border: 1px solid #e5e5e5;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.12);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Every feature, one click away.</h1>
      <p>
        See how many spam posts were hidden today, change the protection level, and turn each feature on or off from the
        toolbar.
      </p>
    </div>
    <img src="popup.png" width="340" height="528" alt="" />
  </body>
</html>
