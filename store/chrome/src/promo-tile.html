<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Small promo tile</title>
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 0 36px;
        box-sizing: border-box;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .name img {
        border-radius: 14px;
      }
      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.4;
        color: #b3b3b3;
      }
    </style>
  </head>
  <body>
    <div class="name"><img src="../../../public/icon/128.png" width="64" height="64" alt="" />Refined Threads</div>
    <p>A spam filter, account info, real dates, and keyboard navigation for Threads.</p>
  </body>
</html>
