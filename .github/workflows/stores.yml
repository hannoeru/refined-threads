name: Stores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to submit, for example v0.2.0
        required: true
      store:
        description: Store to submit to
        type: choice
        options: [all, chrome, firefox, edge]
        default: all
      dry-run:
        description: Check authentication only. Upload nothing and submit nothing.
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

jobs:
  chrome:
    if: vars.CHROME_EXTENSION_ID != '' && (github.event_name == 'release' || inputs.store == 'all' || inputs.store == 'chrome')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    concurrency: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the Chrome zip from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern '*-chrome.zip' --dir release
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false
      - name: Submit to the Chrome Web Store
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: pnpm exec wxt submit --chrome-zip release/*-chrome.zip --dry-run "$DRY_RUN"

  firefox:
    if: vars.FIREFOX_LISTED == 'true' && (github.event_name == 'release' || inputs.store == 'all' || inputs.store == 'firefox')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firefox-add-ons
    concurrency: firefox-add-ons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the Firefox and sources zips from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern '*-firefox.zip' --pattern '*-sources.zip' --dir release
      - name: Submit to Firefox Add-ons
        env:
          FIREFOX_EXTENSION_ID: refined-threads@hannoeru.me
          FIREFOX_CHANNEL: listed
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: pnpm exec wxt submit --firefox-zip release/*-firefox.zip --firefox-sources-zip release/*-sources.zip --dry-run "$DRY_RUN"

  edge:
    if: vars.EDGE_PRODUCT_ID != '' && (github.event_name == 'release' || inputs.store == 'all' || inputs.store == 'edge')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: edge-add-ons
    concurrency: edge-add-ons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the Chrome zip from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern '*-chrome.zip' --dir release
      - name: Submit to Edge Add-ons
        env:
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ vars.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: pnpm exec wxt submit --edge-zip release/*-chrome.zip --dry-run "$DRY_RUN"
