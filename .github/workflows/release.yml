name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: pnpm check

      - name: Package for Chrome, Edge, and Firefox
        run: pnpm zip && pnpm zip:firefox

      - name: Create a draft release with notes from the commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec changelogithub --draft --assets '.output/*.zip'

      # Immutable releases lock assets on publish, so the zips go on the draft first.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length')" = 3
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # A release published with GITHUB_TOKEN starts no `release` workflows, so dispatch the store run.
      - name: Submit the release to the stores
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stores.yml --repo "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME" -f store=all -f dry-run=false
